name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Budget Master 9000 ${{ github.ref_name }}
          releaseBody: |
            Offline monthly budget app — private, local, freeware (MIT).

            **Portable tip:** place `bm9000.portable` next to the `.exe` to keep the database on a USB drive.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis,msi
