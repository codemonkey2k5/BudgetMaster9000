name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Budget Master 9000 ${{ github.ref_name }}
          releaseBody: |
            Offline monthly budget app — private, local, freeware (MIT).

            ### Download (pick one)

            | File | New install | Upgrade |
            |------|-------------|---------|
            | **Installer** (setup `.exe` or `.msi`) | Run it. Open from Start menu. | Run the new setup. Budget data stays in AppData — no file copying. |
            | **Portable** (`BudgetMaster9000.exe`) | Save anywhere, double-click. | Replace the old `.exe` in the **same folder**. `bm9000.db` stays put. |

            No accounts. No cloud. No manual database moves.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis,msi

      - name: Attach portable single-file exe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Copy-Item "src-tauri/target/release/budget-master-9000.exe" "BudgetMaster9000.exe" -Force
          gh release upload "${{ github.ref_name }}" "BudgetMaster9000.exe" --clobber
