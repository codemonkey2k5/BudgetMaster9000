name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Build Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Budget Master 9000 ${{ github.ref_name }}
          releaseBody: |
            Offline monthly budget app — private, local, freeware (MIT).

            **Installer:** run the setup (or MSI). Open the app from the Start menu when it finishes.

            **Portable:** download `BudgetMaster9000.exe`, double-click it. Your database is created next to it on first run. Nothing else to install or copy.
          releaseDraft: true
          prerelease: false
          args: --bundles nsis,msi

      - name: Attach portable single-file exe
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Copy-Item "src-tauri/target/release/budget-master-9000.exe" "BudgetMaster9000.exe" -Force
          gh release upload "${{ github.ref_name }}" "BudgetMaster9000.exe" --clobber
