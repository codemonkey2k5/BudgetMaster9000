[package]
name = "budget-master-9000"
version = "1.2.0"
description = "Budget Master 9000 — private offline monthly budget app"
authors = ["Budget Master 9000 Contributors"]
edition = "2021"

[lib]
name = "budget_master_9000_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-localhost = "2"
portpicker = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
thiserror = "2"
dirs = "6"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
# Optional: local-only update notification tester (not shipped in the product installer)
eframe = { version = "0.29", optional = true, default-features = true }

[features]
default = []
# Build Tony's local update-check tester: cargo build --release --bin bm9000-update-tester --features update-tester
update-tester = ["dep:eframe"]

[[bin]]
name = "bm9000-update-tester"
path = "src/bin/update_tester.rs"
required-features = ["update-tester"]
